
<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
</head>
<body>
    <h2>Attendance Report</h2>
    <table border="1" cellpadding="5">
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Department</th>
            <th>Status</th>
        </tr>
        {% for r in records %}
        <tr>
            <td>{{ r.student.roll_no }}</td>
            <td>{{ r.student.name }}</td>
            <td>{{ r.student.department }}</td>
            <td>{{ r.status }}</td>
        </tr>
        {% endfor %}
    </table>
    <a href="/">Back</a>
</body>
</html>
